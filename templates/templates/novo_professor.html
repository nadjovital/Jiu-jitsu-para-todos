{% extends "base.html" %}
{% block title %}Novo Professor - Jiu-Jitsu Todo{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-badge me-2"></i>Cadastrar Professor
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nome Completo *</label>
                            <input type="text" name="nome" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CPF *</label>
                            <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Senha de Acesso *</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Faixa</label>
                            <select name="faixa" class="form-select">
                                {% for f in faixas %}
                                <option value="{{ f }}" {% if f == 'Preta' %}selected{% endif %}>{{ f }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Graus</label>
                            <input type="number" name="graus" class="form-control" min="0" max="6" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefone</label>
                            <input type="text" name="telefone" class="form-control">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-accent">Cadastrar Professor</button>
                        <a href="{{ url_for('listar_professores') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
